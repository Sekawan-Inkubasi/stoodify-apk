name: Build Android APK (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nama Tag Rilis (Opsional, contoh: v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK (Manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --no-install

      - name: Configure APK Size Optimizations
        run: |
          cat << 'EOF' >> android/gradle.properties
          # Optimasi Ukuran Binary APK (~9.9 MB)
          reactNativeArchitectures=arm64-v8a
          expo.useLegacyPackaging=true
          android.enableShrinkResourcesInReleaseBuilds=true
          android.enableMinifyInReleaseBuilds=true
          android.enablePngCrunchInReleaseBuilds=true
          EOF

      - name: Copy Web Assets to Android Native
        run: |
          mkdir -p android/app/src/main/assets/web
          if [ -d "assets/web" ]; then
            cp -r assets/web/* android/app/src/main/assets/web/
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pexpo.useLegacyPackaging=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enablePngCrunchInReleaseBuilds=true \
            --no-daemon

      - name: Prepare APK Artifacts
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME:-manual}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/stoodify-${TAG}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stoodify-Manual-Build-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (If Tag Provided)
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Stoodify Mobile ${{ github.event.inputs.release_tag }} (APK)
          body: |
            ## 📱 Stoodify Mobile Release ${{ github.event.inputs.release_tag }}

            File installer resmi aplikasi Stoodify (APK) untuk perangkat Android.
            - **Versi Tag:** `${{ github.event.inputs.release_tag }}`
            - **Target Arsitektur:** Android ARM64 (`arm64-v8a`)
            - **Ukuran:** Ramping (~9.9 MB)
            - **Aplikasi:** 100% Offline-First Embedded Bundle
          files: |
            android/app/build/outputs/apk/release/stoodify-${{ github.event.inputs.release_tag }}.apk
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
